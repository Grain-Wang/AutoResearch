version: 1

# Paths are resolved relative to this file. Keep the active remote copy and its
# SQLite state under ~/whr/paper1/queue; do not commit machine-specific paths.
run_root: ../../../.local-deps/paper1-gpu-queue/runs
report_path: ../../../.local-deps/paper1-gpu-queue/GPU_EXPERIMENT_STATUS.md

scheduler:
  poll_interval_seconds: 30
  idle_samples: 4
  memory_used_limit_mib: 1024
  utilization_limit_percent: 5
  max_parallel_gpu_tasks: 2
  max_parallel_cpu_tasks: 1
  random_backoff_seconds: 15
  shared_memory_reserve_mib: 4096

tasks:
  - id: qa-ruff
    command: [python, -m, ruff, check, paper1]
    cwd: ../../..
    gpu_count: 0
    timeout_seconds: 900

  - id: qa-black
    command: [python, -m, black, --check, paper1]
    cwd: ../../..
    gpu_count: 0
    depends_on: [qa-ruff]
    timeout_seconds: 900

  - id: qa-pytest
    command:
      - python
      - -m
      - pytest
      - paper1/tests
      - -q
      - --basetemp
      - .local-deps/pytest-paper1
    cwd: ../../..
    gpu_count: 0
    depends_on: [qa-black]
    timeout_seconds: 1800

  - id: step003-build-training-pilot
    command:
      - python
      - -m
      - paper1.experiments.covol.build_training_pilot_manifest
      - --config
      - paper1/configs/covol/training_pilot_manifest.json
      - --output
      - paper1/data/covol/image_manifest.jsonl
      - --audit
      - paper1/data/covol/split_audit.json
    cwd: ../../..
    gpu_count: 0
    depends_on: [qa-pytest]
    required_outputs:
      - paper1/data/covol/image_manifest.jsonl
      - paper1/data/covol/split_audit.json
    timeout_seconds: 3600

  - id: step003-coverage
    command:
      - python
      - -m
      - paper1.experiments.covol.audit_annotation_coverage
      - --input
      - paper1/data/covol/image_manifest.jsonl
      - --split-audit
      - paper1/data/covol/split_audit.json
      - --output-csv
      - paper1/results/covol/annotation_coverage.csv
      - --output-json
      - paper1/results/covol/annotation_coverage.json
    cwd: ../../..
    gpu_count: 0
    depends_on: [step003-build-training-pilot]
    required_outputs:
      - paper1/results/covol/annotation_coverage.csv
      - paper1/results/covol/annotation_coverage.json
    gate:
      artifact: paper1/results/covol/annotation_coverage.json
      field: status
      equals: PASS
    timeout_seconds: 3600

  - id: step003-conditional-detectability
    command:
      - python
      - -m
      - paper1.experiments.covol.power_analysis
      - --manifest
      - paper1/data/covol/image_manifest.jsonl
      - --split-audit
      - paper1/data/covol/split_audit.json
      - --coverage-decision
      - paper1/results/covol/annotation_coverage.json
      - --output-csv
      - paper1/results/covol/power_analysis.csv
      - --output-json
      - paper1/results/covol/power_analysis.json
      - --simulations
      - "5000"
      - --seed
      - "20260821"
    cwd: ../../..
    gpu_count: 0
    depends_on: [step003-coverage]
    required_outputs:
      - paper1/results/covol/power_analysis.csv
      - paper1/results/covol/power_analysis.json
    gate:
      artifact: paper1/results/covol/power_analysis.json
      field: status
      equals: PASS
    timeout_seconds: 21600
    seed: 20260821

  # Enable only for a deployment canary. This is deliberately not a scientific
  # task and no later paper task may depend on it.
  - id: gpu-canary-shared
    enabled: false
    command:
      - python
      - -c
      - >-
        import json, os, time; from pathlib import Path; import torch;
        assert torch.cuda.is_available(); torch.cuda.reset_peak_memory_stats();
        started=time.perf_counter(); x=torch.ones(1024,device='cuda');
        torch.cuda.synchronize(); result={'allocation_mode':
        os.environ['RESEARCHCLAW_GPU_ALLOCATION_MODE'], 'assigned_gpu':
        int(os.environ['RESEARCHCLAW_ASSIGNED_GPU']), 'torch_version':
        torch.__version__, 'cuda_version': torch.version.cuda, 'gpu_name':
        torch.cuda.get_device_name(0), 'tensor_sum': float(x.sum()),
        'elapsed_seconds': time.perf_counter()-started,
        'max_memory_allocated_mib': torch.cuda.max_memory_allocated()/1048576,
        'max_memory_reserved_mib': torch.cuda.max_memory_reserved()/1048576};
        output=Path(os.environ['RESEARCHCLAW_RUN_DIR'])/'result.json';
        output.write_text(json.dumps(result,indent=2,sort_keys=True),encoding='utf-8');
        print(json.dumps(result,sort_keys=True))
    cwd: ../../..
    gpu_count: 1
    allocation_mode: shared
    memory_required_mib: 1024
    comparison_group: gpu-canary
    run_outputs: [result.json]
    timeout_seconds: 120

  - id: gpu-canary-exclusive
    enabled: false
    command:
      - python
      - -c
      - >-
        import json, os, time; from pathlib import Path; import torch;
        assert torch.cuda.is_available(); torch.cuda.reset_peak_memory_stats();
        started=time.perf_counter(); x=torch.ones(1024,device='cuda');
        torch.cuda.synchronize(); result={'allocation_mode':
        os.environ['RESEARCHCLAW_GPU_ALLOCATION_MODE'], 'assigned_gpu':
        int(os.environ['RESEARCHCLAW_ASSIGNED_GPU']), 'torch_version':
        torch.__version__, 'cuda_version': torch.version.cuda, 'gpu_name':
        torch.cuda.get_device_name(0), 'tensor_sum': float(x.sum()),
        'elapsed_seconds': time.perf_counter()-started,
        'max_memory_allocated_mib': torch.cuda.max_memory_allocated()/1048576,
        'max_memory_reserved_mib': torch.cuda.max_memory_reserved()/1048576};
        output=Path(os.environ['RESEARCHCLAW_RUN_DIR'])/'result.json';
        output.write_text(json.dumps(result,indent=2,sort_keys=True),encoding='utf-8');
        print(json.dumps(result,sort_keys=True))
    cwd: ../../..
    gpu_count: 1
    allocation_mode: exclusive
    memory_required_mib: 1024
    comparison_group: gpu-canary
    run_outputs: [result.json]
    timeout_seconds: 120
