[project]
name = "researchclaw"
version = "0.7.0"
description = "AGENTS-governed research execution toolbox"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arxiv>=2.1",
    "PyYAML>=6.0",
]
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23"]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
researchclaw = "researchclaw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchclaw"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
