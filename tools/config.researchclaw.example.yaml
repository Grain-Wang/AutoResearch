# Copy this file to an ignored config.yaml. Never put credentials here.
research:
  topic: "A falsifiable algorithmic research question"
  domains:
    - machine_learning

literature_search:
  sources:
    - openalex
    - semantic_scholar
    - arxiv
  max_results_per_query: 20
  year_min: 2022
  openalex_email: ""
  openalex_api_key_env: OPENALEX_API_KEY
  s2_api_key_env: S2_API_KEY

experiment:
  # Only real local subprocess and SSH execution are supported.
  mode: sandbox
  time_budget_sec: 300
  sandbox:
    python_path: python3.12

  # Used only when mode is ssh_remote. Prefer a verified local SSH alias.
  ssh_remote:
    host: ""
    user: ""
    port: 22
    key_path: ""
    gpu_ids: []
    remote_workdir: "~/autoresearch/runs"
    remote_python: python3
    setup_commands: []
    timeout_sec: 600
