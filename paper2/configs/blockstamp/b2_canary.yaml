schema_version: 1
baseline_name: b2-pointwise-canary
baseline_scope: dense interval elimination canary; not B2-strong verified-sparse
backend: MPFR-256-directed
discretization: fixed-step-backward-euler
state_layout: non-ground-node-voltages-then-voltage-source-currents
step_size: 1.0e-5
steps_per_circuit: 100
circuits:
  - rc-source
  - diode-rc-source
tube_radii:
  node_1_voltage: 1.0e-9
  node_2_voltage: 1.0e-12
  voltage_source_current: 1.0e-12
scaling: identity
ordering: normalized-state-layout
threads: 1
allowed_verdicts:
  - ACCEPT
  - UNKNOWN
  - UNSUPPORTED
