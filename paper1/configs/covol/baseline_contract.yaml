version: 3
feature_sets:
  z_b:
    description: visual difficulty plus candidate difference and residual features
  z_c:
    description: z_b plus all text-region semantic features
  z_bc_fixed_width:
    description: fixed-width concatenation of z_b and a semantic block plus mask

heuristics:
  - always_d0
  - always_d1
  - oracle_region
  - clip_similarity
  - uncertainty
  - candidate_difference
  - residual_norm

claim_f_controls:
  b_direct:
    features: z_bc_fixed_width
    semantic_block: masked_zero
    objective: standard_direct_advantage
  c_direct:
    features: z_bc_fixed_width
    semantic_block: observed
    objective: standard_direct_advantage
  c_permuted_global_match:
    features: z_bc_fixed_width
    semantic_block: cross_cluster_length_scene_matched
    objective: standard_direct_advantage
  c_permuted_local_relation:
    features: z_bc_fixed_width
    semantic_block: local_entity_relation_permuted
    objective: standard_direct_advantage

learned:
  l2d_b:
    features: z_b
    objective: standard_l2d
  l2d_c:
    features: z_c
    objective: standard_l2d
  risk_l2d_c:
    features: z_c
    objective: clean_constraint_plus_cvar
  regression_l2d:
    source: arxiv_2403_19494
    features: z_c
    objective: two_stage_regression_deferral_surrogate
  density_ratio_posthoc_l2d:
    source: arxiv_2605_19557
    features: z_c
    objective: density_ratio_cpe
  dense_coherence_l2d:
    source: arxiv_2604_12411
    features: z_c
    objective: dense_collaboration_plus_spatial_coherence
  loo_uncertainty_router:
    source: arxiv_2607_10599
    features: z_c
    objective: leave_one_out_contribution_plus_uncertainty
  main_pr:
    features: z_c
    objective: crossfit_partial_residual_plus_clean_constraint_plus_cvar

objective:
  specification: paper1/steps/014_objective_and_algorithm_spec.md
  cvar_tail_fraction: 0.20
  cvar_beta: 1.0
  partial_residual_standardization: outer_train_median_mad
  huber_delta_standardized: 1.0
  region_weight: valid_depth_pixels_normalized_within_image
  optimizer: adamw
  optimizer_learning_rate: 0.001
  optimizer_weight_decay: 0.0001
  cluster_batch_size: 8
  maximum_images_per_cluster_per_batch: 4
  eta_initialization: outer_train_empirical_risk_quantile_0.80
  eta_learning_rate: 0.001
  eta_update_frequency: every_optimizer_step
  clean_retention_constraint: 0.80
  clean_gain_practical_threshold: max_2x_repeatability_q95_or_1pct_d0_risk
  clean_gain_invalid_bootstrap_fraction_stop: 0.05
  corruption_aggregation: complete_variant_region_weighted_then_worst_of_3_then_image_tail
  dual_initial_value: 0.0
  dual_learning_rate: 0.01
  dual_max_value: 100.0
  dual_update_frequency: every_optimizer_step_signed_constraint
  gate_temperature: 0.10
  dev_threshold_selection: min_cvar_among_retention_ge_0.80
  dev_threshold_tie_break: max_retention_then_smallest_threshold_id
  internal_test_primary_metrics:
    - cvar_at_dev_frozen_retention_ge_0.80
    - worst_of_3_at_dev_frozen_retention_ge_0.80
  hypervolume_role: secondary_only

artifact_controls:
  text_only:
    features: raw_caption_content
  frozen_vlm_grounding:
    features: frozen_image_caption_grounding

robust_experts:
  - caption_dropout
  - seen_family_corruption_augmentation
  - three_caption_ensemble
  - image_caption_consistency_filter

feature_policy:
  allowed_source_kinds: [image, candidate, caption_content]
  denylist:
    - error_type
    - template_id
    - generator
    - generator_revision
    - variant_id
    - machine_check
    - source_caption_hash
    - split
    - ground_truth
    - depth_gt
    - target
    - label
    - advantage
    - a_p
    - d0_loss
    - d1_loss
    - oracle
    - test_metric
  require_source_function: true
  require_repository_relative_source_file_path: true
  require_source_file_sha256: true
  recompute_source_file_sha256: true

fairness:
  d0_text_input: trainable_shared_learned_null_token
  d0_d1_text_path_identical: true
  require_layerwise_active_gradient_parity: true
  published_adaptation_modes: [faithful, capacity_matched]
  capacity_matched_parameter_tolerance: 0.10
  hyperparameter_trials: 20
  seeds: [17, 29, 43]
  coverage_grid: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
  require_identical_z_c_columns: true
  require_identical_expert_cache: true
  require_oof_expert_cache_for_router_train: true
  require_identical_metric_version: true
  bootstrap_unit: frozen_cluster_id
  bootstrap_replicates: 10000
  hypervolume_reference: 1.05_times_dev_always_d1_cvar
  hypervolume_role: secondary_only
  primary_claim_m_selection: dev_frozen_cvar_at_clean_retention_ge_0.80
  claim_m_requires_all_direct_baselines: true
