[project]
name = "autoresearch-paper2"
version = "0.1.0"
# The experiment code has no third-party Python runtime dependency.  It loads MPFR
# through ctypes; the required system library is declared below and installed in CI.
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.autoresearch.system-requirements]
mpfr = ">=4.2"
